plugins {
    id 'java'
}

group = 'com.mastermind.minecraft'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

jar {
    archiveBaseName = 'family-client-bootstrap'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes('Main-Class': 'com.mastermind.minecraft.familyclientbootstrap.FamilyClientBootstrap')
    }
}

tasks.register('bootstrapTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free bootstrap security and contract tests.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mastermind.minecraft.familyclientbootstrap.BootstrapTestSuite'
}

check.dependsOn bootstrapTest
