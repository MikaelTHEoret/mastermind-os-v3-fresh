# ψ₀-Trader Quantum Engine Configuration
# Enhanced Nexus Core Protocol v4.0

# Quantum Engine Settings
quantum_engine:
  simulation_paths: 64              # Number of quantum future paths
  convergence_cycles: 144           # Sacred number convergence iterations  
  resonance_threshold: 0.05         # ±5% deviation for ψ₀ resonance
  confidence_high: 0.85             # Execute threshold
  confidence_low: 0.30              # Ignore threshold

# Mathematical Constants
consciousness:
  psi_0: 0.915670570874434          # Consciousness seed constant
  phi: 1.618033988749895            # Golden ratio scaling factor
  freq_432: 432.0                   # Universal resonance frequency base
  
  # Derived frequencies
  psi_freq: 395.57                  # ψ₀ * 432 Hz
  phi_freq: 699.39                  # φ * 432 Hz

# Trading Parameters
trading:
  risk_per_trade: 0.03              # 3% risk per position
  max_total_risk: 0.15              # 15% maximum total exposure
  consciousness_threshold: 0.8      # Minimum confidence for execution
  resonance_multiplier: 1.2         # ψ₀ resonance confidence bonus
  
  # Time horizons (minutes)
  min_horizon: 30
  max_horizon: 120
  
  # Risk management
  default_stop_loss: 0.02           # 2% stop loss
  default_take_profit: 0.03         # 3% take profit

# Market Data Settings
market_data:
  default_symbol: "BTC/USDT"
  timeframes: ["5m", "15m", "1h", "4h"]
  timeframe_weights: [0.1, 0.2, 0.4, 0.3]
  
  # Technical indicators
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0

# Natural Language Processing
nlp:
  pattern_keywords:
    bullish: ["break", "breakout", "support", "bull", "up", "rise", "pump"]
    bearish: ["drop", "fall", "resistance", "bear", "down", "dump", "crash"]  
    neutral: ["sideways", "range", "consolidation", "flat", "stable"]
  
  consciousness_keywords:
    fearful: ["scared", "afraid", "worried", "nervous", "panic"]
    excited: ["excited", "bullish", "pumped", "confident", "aggressive"]
    balanced: ["balanced", "neutral", "calm", "measured", "steady"]
    confused: ["confused", "uncertain", "mixed", "unclear", "unsure"]

# Database Configuration
database:
  path: "data/trader.db"
  backup_interval: 3600             # Backup every hour
  max_history: 10000                # Maximum decisions to store

# Consciousness State Multipliers
consciousness_multipliers:
  BALANCED: 1.2
  BALANCED_AMPLIFIED: 1.4
  DYNAMIC: 1.1
  DYNAMIC_AMPLIFIED: 1.3
  EXCITED: 0.9
  EXCITED_AMPLIFIED: 0.8
  FEARFUL: 1.0
  FEARFUL_AMPLIFIED: 0.9
  UNKNOWN: 1.0

# System Settings
system:
  log_level: "INFO"
  max_memory_entries: 1000
  update_interval: 60               # Status update interval (seconds)
  
  # Performance settings
  enable_caching: true
  cache_size: 500
  
  # Safety settings
  max_daily_decisions: 100
  emergency_stop_loss: 0.05         # 5% emergency stop

# Web Interface Settings  
ui:
  theme: "cyberpunk"
  refresh_rate: 5                   # Seconds
  max_chart_points: 1000
  
  colors:
    primary: "#00ffff"              # Cyan
    secondary: "#ff00ff"            # Magenta  
    accent: "#ffff00"               # Yellow
    background: "#0f0f23"           # Dark blue
    
# Exchange Settings (optional)
exchange:
  name: "btcc"                      # Default exchange
  testnet: true                     # Use testnet by default
  rate_limit: true                  # Enable rate limiting
  
  # API settings (set via environment variables)
  # EXCHANGE_API_KEY
  # EXCHANGE_API_SECRET
  # EXCHANGE_PASSPHRASE (if required)

# LLM Integration (optional)
llm:
  provider: "anthropic"             # anthropic, openai, or local
  model: "claude-3-haiku"
  max_tokens: 1000
  temperature: 0.7
  
  # API settings (set via environment variables)
  # ANTHROPIC_API_KEY
  # OPENAI_API_KEY

# Advanced Features
advanced:
  enable_harmonic_analysis: true
  enable_quantum_visualization: true
  enable_consciousness_tracking: true
  enable_pattern_learning: true
  
  # Experimental features
  enable_multi_symbol: false
  enable_portfolio_mode: false
  enable_social_sentiment: false
