name: Disposable coding permission SQL checks

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'services/mastermind-context-gateway/**'
      - '.github/workflows/coding-permission-sql.yml'
  pull_request:
    paths:
      - 'services/mastermind-context-gateway/**'
      - '.github/workflows/coding-permission-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-permission-sql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-fixture:
    if: github.repository == 'MikaelTHEoret/mastermind-os-v3-fresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        # Official library/postgres 17-bookworm, exact Linux amd64 manifest.
        # Verified by Docker Hub metadata and registry HEAD on 2026-09-07.
        image: postgres@sha256:7bade6d532592ca8ce7ee32def7399dad2607c4ea5583839fc4352a095a11ea6
        env:
          POSTGRES_DB: mastermind_fixture_permissions_v2
          POSTGRES_USER: fixture_operator
          # Public, synthetic job credential; no account secret is referenced.
          POSTGRES_PASSWORD: fixture-${{ github.run_id }}
        # No host port. The same container's pinned psql connects via loopback.
        options: >-
          --health-cmd "pg_isready -U fixture_operator -d mastermind_fixture_permissions_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIXTURE_POSTGRES_IMAGE: postgres@sha256:7bade6d532592ca8ce7ee32def7399dad2607c4ea5583839fc4352a095a11ea6
      FIXTURE_POSTGRES_PASSWORD: fixture-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - name: Verify service image and same-image client identity
        env:
          FIXTURE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def read(*args):
              return subprocess.check_output(args, timeout=10, text=True).strip()
          container = os.environ['FIXTURE_POSTGRES_CONTAINER']
          expected = os.environ['FIXTURE_POSTGRES_IMAGE']
          pinned_id = read('docker', 'image', 'inspect', '--format', '{{.Id}}', expected)
          actual_id = read('docker', 'inspect', '--format', '{{.Image}}', container)
          if pinned_id != actual_id:
              raise SystemExit('FIXTURE_POSTGRES_IMAGE_CHANGED')
          record = {
              'scope': 'disposable-ci-database-only', 'image': expected,
              'containerImageId': actual_id,
              'serverBinaryVersion': read('docker', 'exec', container, 'postgres', '--version'),
              'clientVersion': read('docker', 'exec', container, 'psql', '--version'),
              'hostPortsPublished': False,
          }
          runner = pathlib.Path('services/mastermind-context-gateway/scripts/verify-coding-permissions-sql.py')
          record['runnerSha256'] = hashlib.sha256(runner.read_bytes()).hexdigest()
          text = json.dumps(record, sort_keys=True)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'coding-permission-sql-environment.json').write_text(text + '\n')
          print(text)
          PY
      - name: Verify shared guards and bounded diagnostic handling
        working-directory: services/mastermind-context-gateway
        run: python -m unittest discover -s test -p 'test_coding_permission*.py' -q
      - name: Execute actual migrations against rollback-only synthetic fixtures
        env:
          FIXTURE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mastermind-fixture-psql" <<'SH'
          #!/bin/sh
          set -eu
          exec docker exec -i \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e PGCONNECT_TIMEOUT -e PGAPPNAME \
            "$FIXTURE_POSTGRES_CONTAINER" psql "$@"
          SH
          chmod 700 "$RUNNER_TEMP/mastermind-fixture-psql"
          python services/mastermind-context-gateway/scripts/verify-coding-permissions-sql.py \
            --dsn "postgresql://fixture_operator:${FIXTURE_POSTGRES_PASSWORD}@127.0.0.1:5432/mastermind_fixture_permissions_v2" \
            --psql "$RUNNER_TEMP/mastermind-fixture-psql" \
            | tee "$RUNNER_TEMP/coding-permission-sql-result.json"
      - name: Retain bounded fixture evidence in the job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as target:
              target.write('Disposable PostgreSQL permission evidence; no canonical database or account secrets.\n\n')
              for name in ('coding-permission-sql-environment.json', 'coding-permission-sql-result.json'):
                  path = root / name
                  if path.is_file() and path.stat().st_size <= 16384:
                      value = json.loads(path.read_text())
                      target.write('```json\n' + json.dumps(value, sort_keys=True, indent=2) + '\n```\n\n')
                  else:
                      target.write(name + ': unavailable; no acceptance inferred.\n\n')
          PY
