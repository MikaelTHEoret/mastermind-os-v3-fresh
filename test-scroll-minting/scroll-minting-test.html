<!DOCTYPE html>
<html lang="en">

            </div>
        </div>

        <div class="test-section">
            <h3>🔗 Web3 Connection Test</h3>
            <button onclick="testWalletConnection()">Test Wallet Connection</button>
            <button onclick="checkNetworks()">Check Networks</button>
            <button onclick="validateParameters()">Validate Parameters</button>
        </div>

        <div class="test-section">
            <h3>⚡ Minting Tests</h3>

            <button onclick="testContractValidation()">Test Contract Validation</button>
        </div>

        <div class="test-section">
            <h3>📊 Test Log</h3>
            <div id="testLog" class="log"></div>
            <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>

    <script>
        // Import the scroll contract functions
        // Note: In real implementation, these would be imported from the actual modules

        function log(message) {
            const logDiv = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('testLog').innerHTML = '';
        }

        // Test 1: Wallet Connection
        async function testWalletConnection() {
            log('🔄 Testing wallet connection...');
            
            if (typeof window.ethereum === 'undefined') {
                log('❌ No Web3 wallet detected (MetaMask not installed)');
                return false;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) {
                    log(`✅ Wallet connected: ${accounts[0]}`);
                    return true;
                } else {
                    log('⚠️ Wallet not connected - requesting connection...');
                    const newAccounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    if (newAccounts.length > 0) {
                        log(`✅ Wallet connected: ${newAccounts[0]}`);
                        return true;
                    } else {
                        log('❌ Wallet connection failed');
                        return false;
                    }
                }
            } catch (error) {
                log(`❌ Wallet connection error: ${error.message}`);
                return false;
            }
        }

        // Test 2: Network Information
        async function checkNetworks() {
            log('🔄 Checking network information...');
            
            if (typeof window.ethereum === 'undefined') {
                log('❌ No Web3 wallet detected');
                return;
            }

            try {
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                log(`📡 Current Chain ID: ${chainId}`);
                
                switch (chainId) {
                    case '0x1':
                        log('✅ Connected to Ethereum Mainnet');
                        break;
                    case '0x82750':
                        log('✅ Connected to Scroll Mainnet');
                        break;
                    case '0xaa36a7':
                        log('⚠️ Connected to Sepolia Testnet');
                        break;
                    case '0x8274f':
                        log('⚠️ Connected to Scroll Sepolia');
                        break;
                    default:
                        log(`⚠️ Connected to unknown network: ${chainId}`);
                }
            } catch (error) {
                log(`❌ Network check error: ${error.message}`);
            }
        }
